<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1a1033" />
<title>梦境日记</title>
<style>
  :root {
    --bg-top: #0d0a1f;
    --bg-mid: #1a1033;
    --bg-bot: #2d1b4e;
    --glass: rgba(255, 255, 255, 0.07);
    --glass-strong: rgba(255, 255, 255, 0.12);
    --border: rgba(255, 255, 255, 0.14);
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.65);
    --text-faint: rgba(255, 255, 255, 0.4);
    --primary: #c084fc;
    --primary-2: #f0abfc;
    --accent: #7dd3fc;
    --warn: #fda4af;
    --radius: 18px;
    --radius-sm: 12px;
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--text);
    background: var(--bg-top);
    overflow-x: hidden;
  }

  /* animated aurora background */
  .aurora {
    position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-mid) 45%, var(--bg-bot) 100%);
  }
  .aurora::before, .aurora::after {
    content: ""; position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.55;
  }
  .aurora::before {
    width: 500px; height: 500px; background: #a855f7; top: -150px; left: -120px;
    animation: float1 14s ease-in-out infinite;
  }
  .aurora::after {
    width: 480px; height: 480px; background: #ec4899; bottom: -180px; right: -120px;
    animation: float2 16s ease-in-out infinite;
  }
  .aurora .blob3 {
    position: absolute; width: 380px; height: 380px; background: #3b82f6;
    top: 40%; left: 50%; border-radius: 50%; filter: blur(90px); opacity: 0.3;
    animation: float3 18s ease-in-out infinite;
  }
  @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(60px,40px)} }
  @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-50px,-30px)} }
  @keyframes float3 { 0%,100%{transform:translate(-50%,-50%)} 50%{transform:translate(-30%,-60%)} }

  .app {
    position: relative; z-index: 1;
    max-width: 720px; margin: 0 auto;
    padding: 0 16px 110px;
    min-height: 100vh;
  }

  /* Header */
  .header {
    padding: 28px 4px 20px;
  }
  .header-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .greeting { font-size: 0.85rem; color: var(--text-dim); letter-spacing: 0.5px; }
  .date-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--border);
    backdrop-filter: blur(10px);
    font-size: 0.82rem; color: var(--primary-2);
    font-weight: 500;
  }
  .title-block h1 {
    font-size: 2rem; font-weight: 800; letter-spacing: -0.5px;
    background: linear-gradient(135deg, #fff 0%, #c084fc 50%, #f0abfc 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    line-height: 1.2;
  }
  .title-block .sub { font-size: 0.9rem; color: var(--text-dim); margin-top: 4px; }

  /* Stat cards */
  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    margin: 18px 0 22px;
  }
  .stat-card {
    background: var(--glass); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 14px 10px;
    backdrop-filter: blur(10px); text-align: center;
  }
  .stat-card .num {
    font-size: 1.6rem; font-weight: 700;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .stat-card .lbl { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }

  /* Search bar */
  .search-bar {
    display: flex; gap: 8px; margin-bottom: 18px;
  }
  .search-input {
    flex: 1; padding: 12px 16px;
    background: var(--glass); border: 1px solid var(--border);
    border-radius: 14px; color: var(--text); font-size: 0.9rem;
    outline: none; backdrop-filter: blur(10px); font-family: inherit;
  }
  .search-input::placeholder { color: var(--text-faint); }
  .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(192,132,252,0.18); }

  .sort-btn {
    padding: 0 14px; border-radius: 14px;
    background: var(--glass); border: 1px solid var(--border);
    color: var(--text-dim); font-size: 0.85rem; cursor: pointer;
    backdrop-filter: blur(10px); white-space: nowrap;
  }
  .sort-btn:active { transform: scale(0.96); }

  /* Entries list */
  .entries { display: flex; flex-direction: column; gap: 14px; }

  .entry {
    background: var(--glass); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px;
    backdrop-filter: blur(14px); box-shadow: var(--shadow);
    position: relative; overflow: hidden;
    animation: rise 0.5s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise { from { opacity:0; transform: translateY(16px) scale(.98);} to {opacity:1; transform:none;} }

  .entry::after {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--primary), var(--primary-2), var(--accent));
  }

  .entry-head { margin-bottom: 10px; }
  .entry-title {
    font-size: 1.1rem; font-weight: 700; color: #fff;
    margin-bottom: 6px; word-break: break-word;
  }
  .entry-meta {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 0.78rem; color: var(--text-dim);
  }
  .meta-dot {
    display: inline-flex; align-items: center; gap: 4px;
  }
  .mood-badge {
    padding: 3px 10px; border-radius: 999px;
    background: rgba(192,132,252,0.18); color: var(--primary-2);
    font-size: 0.75rem; font-weight: 500;
  }

  .entry-body {
    font-size: 0.92rem; line-height: 1.7; color: rgba(255,255,255,0.85);
    white-space: pre-wrap; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .entry-body.expanded { -webkit-line-clamp: unset; }

  .entry-foot {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 14px; padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .expand-btn {
    background: none; border: none; color: var(--primary-2);
    font-size: 0.82rem; cursor: pointer; padding: 4px 0;
  }
  .entry-actions { display: flex; gap: 6px; }
  .act-btn {
    width: 34px; height: 34px; border-radius: 10px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-dim); font-size: 0.95rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .act-btn:hover { color: #fff; background: rgba(255,255,255,0.12); }
  .act-btn.danger:hover { color: var(--warn); background: rgba(253,164,175,0.12); }
  .act-btn:active { transform: scale(0.9); }

  /* Empty state */
  .empty {
    text-align: center; padding: 60px 20px;
    animation: rise .5s ease both;
  }
  .empty .moon {
    font-size: 4rem; margin-bottom: 16px; display: block;
    filter: drop-shadow(0 0 20px rgba(192,132,252,0.4));
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  .empty p { color: var(--text-dim); font-size: 0.95rem; }

  /* FAB */
  .fab {
    position: fixed; bottom: 28px; right: 22px; z-index: 50;
    width: 62px; height: 62px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    border: none; color: #1a1033; font-size: 1.8rem; font-weight: 700;
    cursor: pointer; box-shadow: 0 10px 30px rgba(192,132,252,0.5);
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s, box-shadow .2s;
  }
  .fab:active { transform: scale(0.9); box-shadow: 0 5px 15px rgba(192,132,252,0.4); }

  /* Modal / Sheet */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none; transition: opacity .3s;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .sheet {
    width: 100%; max-width: 720px;
    background: linear-gradient(180deg, #231642 0%, #1a1033 100%);
    border: 1px solid var(--border);
    border-radius: 28px 28px 0 0;
    padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform .35s cubic-bezier(.2,.8,.2,1);
    max-height: 92vh; overflow-y: auto;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
  }
  .overlay.show .sheet { transform: translateY(0); }

  .sheet-handle {
    width: 40px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.2); margin: 0 auto 18px;
  }
  .sheet-title {
    font-size: 1.25rem; font-weight: 700; margin-bottom: 18px;
    display: flex; align-items: center; gap: 8px;
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 0.82rem; color: var(--text-dim);
    margin-bottom: 7px; font-weight: 500;
  }
  .field input, .field textarea {
    width: 100%; padding: 13px 14px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px; color: var(--text); font-size: 0.95rem;
    outline: none; font-family: inherit; transition: border-color .2s, box-shadow .2s;
  }
  .field textarea { min-height: 130px; resize: none; line-height: 1.6; }
  .field input:focus, .field textarea:focus {
    border-color: var(--primary); box-shadow: 0 0 0 3px rgba(192,132,252,0.15);
  }
  .field input::-webkit-calendar-picker-indicator { filter: invert(1) brightness(1.3); cursor: pointer; }

  .mood-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .mood-item {
    padding: 11px 8px; border-radius: 12px; text-align: center;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    cursor: pointer; transition: all .2s; font-size: 0.85rem;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .mood-item .emoji { font-size: 1.3rem; }
  .mood-item.active {
    background: linear-gradient(135deg, rgba(192,132,252,0.3), rgba(240,171,252,0.3));
    border-color: var(--primary); color: #fff;
  }

  .sheet-actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn {
    flex: 1; padding: 14px; border-radius: 14px; border: none;
    font-size: 0.98rem; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: transform .15s, opacity .2s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #1a1033; box-shadow: 0 6px 20px rgba(192,132,252,0.35);
  }
  .btn-ghost {
    background: rgba(255,255,255,0.08); color: var(--text);
    border: 1px solid var(--border);
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 100px; left: 50%; z-index: 200;
    transform: translateX(-50%) translateY(20px);
    background: rgba(20,12,40,0.95); border: 1px solid var(--border);
    padding: 11px 22px; border-radius: 12px; color: #fff;
    font-size: 0.9rem; box-shadow: var(--shadow);
    opacity: 0; transition: all .3s; pointer-events: none;
    backdrop-filter: blur(10px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>
  <div class="aurora"><div class="blob3"></div></div>

  <div class="app">
    <header class="header">
      <div class="header-top">
        <span class="greeting" id="greeting">晚安 🌙</span>
        <span class="date-pill" id="datePill"></span>
      </div>
      <div class="title-block">
        <h1>梦境日记</h1>
        <p class="sub">记录每一个漂浮在夜里的故事</p>
      </div>
    </header>

    <div class="stats">
      <div class="stat-card"><div class="num" id="statTotal">0</div><div class="lbl">梦境总数</div></div>
      <div class="stat-card"><div class="num" id="statMonth">0</div><div class="lbl">本月</div></div>
      <div class="stat-card"><div class="num" id="statToday">0</div><div class="lbl">今日</div></div>
    </div>

    <div class="search-bar">
      <input class="search-input" id="searchInput" placeholder="🔍 搜索梦境..." />
      <button class="sort-btn" id="sortBtn">↓ 最新</button>
    </div>

    <div class="entries" id="entries"></div>
    <div class="empty" id="empty" style="display:none;">
      <span class="moon">🌙</span>
      <p id="emptyText">还没有梦境记录，点击右下角开始记录吧</p>
    </div>
  </div>

  <button class="fab" id="fab">+</button>

  <!-- Editor sheet -->
  <div class="overlay" id="overlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title"><span id="sheetIcon">✨</span> <span id="sheetTitle">记录新梦境</span></h2>

      <div class="field">
        <label>梦境时间</label>
        <input type="datetime-local" id="dreamTime" />
      </div>

      <div class="field">
        <label>标题</label>
        <input type="text" id="dreamTitle" placeholder="例如：飞翔在云端" maxlength="60" />
      </div>

      <div class="field">
        <label>心情</label>
        <div class="mood-grid" id="moodGrid">
          <div class="mood-item" data-mood="😊 愉悦"><span class="emoji">😊</span>愉悦</div>
          <div class="mood-item" data-mood="😱 惊恐"><span class="emoji">😱</span>惊恐</div>
          <div class="mood-item" data-mood="🤔 疑惑"><span class="emoji">🤔</span>疑惑</div>
          <div class="mood-item" data-mood="😴 平静"><span class="emoji">😴</span>平静</div>
          <div class="mood-item" data-mood="🥰 温馨"><span class="emoji">🥰</span>温馨</div>
          <div class="mood-item" data-mood="😵 混乱"><span class="emoji">😵</span>混乱</div>
        </div>
      </div>

      <div class="field">
        <label>梦境内容</label>
        <textarea id="dreamContent" placeholder="在这里写下你梦境中的一切……"></textarea>
      </div>

      <div class="sheet-actions">
        <button class="btn btn-ghost" id="cancelBtn">取消</button>
        <button class="btn btn-primary" id="saveBtn">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = "dream_journal_v2";
  let entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  let editingId = null;
  let selectedMood = "";
  let sortDesc = true;

  const $ = (id) => document.getElementById(id);
  const overlay = $("overlay");
  const dreamTime = $("dreamTime");
  const dreamTitle = $("dreamTitle");
  const dreamContent = $("dreamContent");
  const moodGrid = $("moodGrid");
  const sheetTitle = $("sheetTitle");
  const sheetIcon = $("sheetIcon");
  const entriesEl = $("entries");
  const emptyEl = $("empty");
  const emptyText = $("emptyText");
  const searchInput = $("searchInput");
  const sortBtn = $("sortBtn");
  const fab = $("fab");
  const toast = $("toast");

  // Date / greeting
  function setHeader() {
    const now = new Date();
    const weekdays = ["周日","周一","周二","周三","周四","周五","周六"];
    $("datePill").textContent = `${now.getMonth()+1}月${now.getDate()}日 · ${weekdays[now.getDay()]}`;
    const h = now.getHours();
    let g = "凌晨好";
    if (h >= 5 && h < 11) g = "早上好 ☀️";
    else if (h >= 11 && h < 13) g = "中午好 🌤️";
    else if (h >= 13 && h < 18) g = "下午好 🌤️";
    else if (h >= 18 && h < 22) g = "晚上好 🌆";
    else g = "夜深了 🌙";
    $("greeting").textContent = g;
  }
  setHeader();

  function toLocalInput(d) {
    const p = (n) => String(n).padStart(2,"0");
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove("show"), 1800);
  }

  function openSheet(editEntry) {
    if (editEntry) {
      editingId = editEntry.id;
      dreamTime.value = editEntry.time;
      dreamTitle.value = editEntry.title === "无题" ? "" : editEntry.title;
      dreamContent.value = editEntry.content;
      selectedMood = editEntry.mood || "";
      sheetTitle.textContent = "编辑梦境";
      sheetIcon.textContent = "✏️";
      $("saveBtn").textContent = "更新";
    } else {
      editingId = null;
      dreamTime.value = toLocalInput(new Date());
      dreamTitle.value = "";
      dreamContent.value = "";
      selectedMood = "";
      sheetTitle.textContent = "记录新梦境";
      sheetIcon.textContent = "✨";
      $("saveBtn").textContent = "保存";
    }
    document.querySelectorAll(".mood-item").forEach(m => {
      m.classList.toggle("active", m.dataset.mood === selectedMood);
    });
    overlay.classList.add("show");
    setTimeout(() => dreamContent.focus(), 350);
  }

  function closeSheet() { overlay.classList.remove("show"); }

  moodGrid.addEventListener("click", (e) => {
    const item = e.target.closest(".mood-item");
    if (!item) return;
    document.querySelectorAll(".mood-item").forEach(m => m.classList.remove("active"));
    item.classList.add("active");
    selectedMood = item.dataset.mood;
  });

  function save() {
    const time = dreamTime.value;
    const title = dreamTitle.value.trim();
    const content = dreamContent.value.trim();
    if (!time) { showToast("请选择梦境时间"); return; }
    if (!content) { showToast("请填写梦境内容"); return; }

    const record = {
      id: editingId || Date.now().toString(),
      time, title: title || "无题", content, mood: selectedMood,
      updatedAt: Date.now()
    };

    if (editingId) {
      entries = entries.map(e => e.id === editingId ? record : e);
      showToast("梦境已更新");
    } else {
      entries.unshift(record);
      showToast("梦境已保存 ✨");
    }
    persist();
    closeSheet();
    render();
  }

  function persist() { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }

  function deleteEntry(id) {
    if (!confirm("确定要删除这条梦境吗？")) return;
    entries = entries.filter(e => e.id !== id);
    persist();
    render();
    showToast("已删除");
  }

  function formatTime(iso) {
    const d = new Date(iso);
    const p = (n) => String(n).padStart(2,"0");
    return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function updateStats() {
    $("statTotal").textContent = entries.length;
    const now = new Date();
    const monthCount = entries.filter(e => {
      const d = new Date(e.time);
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    }).length;
    const todayCount = entries.filter(e => {
      const d = new Date(e.time);
      return d.toDateString() === now.toDateString();
    }).length;
    $("statMonth").textContent = monthCount;
    $("statToday").textContent = todayCount;
  }

  function render() {
    const kw = searchInput.value.trim().toLowerCase();
    let list = entries.filter(e =>
      !kw || e.title.toLowerCase().includes(kw) || e.content.toLowerCase().includes(kw)
    );
    list = [...list].sort((a,b) => {
      const ta = new Date(a.time).getTime(), tb = new Date(b.time).getTime();
      return sortDesc ? tb - ta : ta - tb;
    });

    entriesEl.innerHTML = "";
    if (list.length === 0) {
      emptyEl.style.display = "block";
      emptyText.textContent = entries.length === 0 ? "还没有梦境记录，点击右下角开始记录吧" : "没有找到匹配的梦境";
    } else {
      emptyEl.style.display = "none";
      list.forEach(e => {
        const card = document.createElement("div");
        card.className = "entry";
        card.innerHTML = `
          <div class="entry-head">
            <div class="entry-title"></div>
            <div class="entry-meta">
              <span class="meta-dot">🕐 <span class="t"></span></span>
              ${e.mood ? `<span class="mood-badge">${e.mood}</span>` : ""}
            </div>
          </div>
          <div class="entry-body"></div>
          <div class="entry-foot">
            <button class="expand-btn">展开 ▾</button>
            <div class="entry-actions">
              <button class="act-btn" data-act="edit" data-id="${e.id}" title="编辑">✏️</button>
              <button class="act-btn danger" data-act="del" data-id="${e.id}" title="删除">🗑️</button>
            </div>
          </div>
        `;
        card.querySelector(".entry-title").textContent = e.title;
        card.querySelector(".entry-meta .t").textContent = formatTime(e.time);
        const body = card.querySelector(".entry-body");
        body.textContent = e.content;
        const expandBtn = card.querySelector(".expand-btn");
        const needsExpand = e.content.length > 100;
        if (!needsExpand) expandBtn.style.display = "none";
        expandBtn.addEventListener("click", () => {
          const ex = body.classList.toggle("expanded");
          expandBtn.textContent = ex ? "收起 ▴" : "展开 ▾";
        });
        entriesEl.appendChild(card);
      });
    }
    updateStats();
  }

  entriesEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn || !btn.dataset.act) return;
    const id = btn.dataset.id;
    if (btn.dataset.act === "edit") {
      const entry = entries.find(x => x.id === id);
      if (entry) openSheet(entry);
    } else if (btn.dataset.act === "del") deleteEntry(id);
  });

  fab.addEventListener("click", () => openSheet(null));
  $("saveBtn").addEventListener("click", save);
  $("cancelBtn").addEventListener("click", closeSheet);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeSheet(); });
  searchInput.addEventListener("input", render);
  sortBtn.addEventListener("click", () => {
    sortDesc = !sortDesc;
    sortBtn.textContent = sortDesc ? "↓ 最新" : "↑ 最早";
    render();
  });

  render();
</script>
</body>
</html>
