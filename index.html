<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>梦境日记 · Dream Journal</title>
<style>
  :root {
    --bg-1: #0f0c29;
    --bg-2: #302b63;
    --bg-3: #24243e;
    --card: rgba(255, 255, 255, 0.08);
    --card-border: rgba(255, 255, 255, 0.18);
    --text: #f4f1ff;
    --muted: #b9b1d6;
    --accent: #a78bfa;
    --accent-2: #f0abfc;
    --accent-3: #7dd3fc;
    --danger: #fb7185;
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
    background-size: 400% 400%;
    animation: bgShift 18s ease infinite;
  }

  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* twinkling stars */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, #fff, transparent),
      radial-gradient(1px 1px at 60% 70%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 80% 20%, #fff, transparent),
      radial-gradient(1px 1px at 40% 85%, #fff, transparent),
      radial-gradient(2px 2px at 90% 50%, #fff, transparent),
      radial-gradient(1px 1px at 10% 60%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 70% 10%, #fff, transparent);
    background-repeat: repeat;
    background-size: 300px 300px;
    opacity: 0.5;
    pointer-events: none;
    animation: twinkle 6s ease-in-out infinite alternate;
    z-index: 0;
  }

  @keyframes twinkle {
    from { opacity: 0.25; }
    to { opacity: 0.65; }
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 980px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
  }

  header h1 {
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--accent-3), var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(167, 139, 250, 0.3);
  }

  header p {
    margin-top: 8px;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .today {
    display: inline-block;
    margin-top: 12px;
    padding: 6px 16px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    backdrop-filter: blur(8px);
    font-size: 0.9rem;
    color: var(--accent-2);
  }

  /* Form card */
  .form-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 24px;
    backdrop-filter: blur(14px);
    box-shadow: var(--shadow);
    margin-bottom: 32px;
  }

  .form-card h2 {
    font-size: 1.2rem;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .form-card h2 .icon { font-size: 1.3rem; }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }

  @media (max-width: 600px) {
    .row { grid-template-columns: 1fr; }
  }

  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input[type="datetime-local"],
  input[type="text"],
  textarea,
  select {
    width: 100%;
    padding: 10px 12px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 10px;
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    font-family: inherit;
  }

  input[type="datetime-local"]::-webkit-calendar-picker-indicator {
    filter: invert(1);
    cursor: pointer;
  }

  textarea {
    resize: vertical;
    min-height: 110px;
    line-height: 1.6;
  }

  input:focus, textarea:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.25);
  }

  .mood-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .mood-chip {
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.15);
    cursor: pointer;
    font-size: 0.9rem;
    transition: all .2s;
    user-select: none;
  }

  .mood-chip:hover { transform: translateY(-1px); }
  .mood-chip.active {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-color: transparent;
    color: #1a1530;
    font-weight: 600;
  }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  button {
    padding: 10px 22px;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform .15s, box-shadow .2s, opacity .2s;
    font-family: inherit;
  }

  .btn-primary {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #1a1530;
    box-shadow: 0 6px 20px rgba(167, 139, 250, 0.35);
  }

  .btn-primary:hover { transform: translateY(-2px); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btn-ghost {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text);
    border: 1px solid var(--card-border);
  }
  .btn-ghost:hover { background: rgba(255, 255, 255, 0.15); }

  /* Search & filter */
  .toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .search-box { flex: 1; min-width: 200px; }
  .sort-box { width: 160px; }

  /* Entries */
  .entries {
    display: grid;
    gap: 16px;
  }

  .entry {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 18px 20px;
    backdrop-filter: blur(12px);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    animation: fadeUp .4s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .entry::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
  }

  .entry-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  .entry-title {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--accent-2);
  }

  .entry-meta {
    font-size: 0.8rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .entry-meta .mood-tag {
    padding: 2px 10px;
    background: rgba(240, 171, 252, 0.15);
    border-radius: 999px;
    color: var(--accent-2);
    font-size: 0.78rem;
  }

  .entry-content {
    line-height: 1.7;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .entry-actions {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .icon-btn {
    background: rgba(255, 255, 255, 0.06);
    color: var(--muted);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 6px 12px;
    font-size: 0.82rem;
    border-radius: 8px;
  }
  .icon-btn:hover { color: var(--text); }
  .icon-btn.danger:hover { color: var(--danger); }

  .empty {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
  }
  .empty .moon {
    font-size: 3rem;
    margin-bottom: 12px;
    display: block;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(30, 20, 60, 0.95);
    border: 1px solid var(--card-border);
    padding: 10px 20px;
    border-radius: 10px;
    color: var(--text);
    box-shadow: var(--shadow);
    opacity: 0;
    transition: all .3s;
    z-index: 100;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🌙 梦境日记</h1>
      <p>记录每一个漂浮在夜晚的故事</p>
      <div class="today" id="todayLabel"></div>
    </header>

    <section class="form-card">
      <h2><span class="icon">✨</span> <span id="formTitle">记录新的梦境</span></h2>

      <div class="row">
        <div>
          <label for="dreamTime">梦境时间</label>
          <input type="datetime-local" id="dreamTime" />
        </div>
        <div>
          <label for="dreamTitle">标题</label>
          <input type="text" id="dreamTitle" placeholder="例如：飞翔在云端" maxlength="60" />
        </div>
      </div>

      <div style="margin-bottom: 14px;">
        <label>梦境心情</label>
        <div class="mood-row" id="moodRow">
          <span class="mood-chip" data-mood="😊 愉悦">😊 愉悦</span>
          <span class="mood-chip" data-mood="😱 惊恐">😱 惊恐</span>
          <span class="mood-chip" data-mood="🤔 疑惑">🤔 疑惑</span>
          <span class="mood-chip" data-mood="😴 平静">😴 平静</span>
          <span class="mood-chip" data-mood="🥰 温馨">🥰 温馨</span>
          <span class="mood-chip" data-mood="😵 混乱">😵 混乱</span>
        </div>
      </div>

      <div>
        <label for="dreamContent">梦境内容</label>
        <textarea id="dreamContent" placeholder="在这里写下你梦境中的一切……"></textarea>
      </div>

      <div class="actions">
        <button class="btn-primary" id="saveBtn">保存梦境</button>
        <button class="btn-ghost" id="cancelBtn" style="display:none;">取消编辑</button>
      </div>
    </section>

    <section>
      <div class="toolbar">
        <input class="search-box" type="text" id="searchInput" placeholder="🔍 搜索梦境标题或内容" />
        <select class="sort-box" id="sortSelect">
          <option value="desc">时间：最新优先</option>
          <option value="asc">时间：最早优先</option>
        </select>
      </div>

      <div class="entries" id="entries"></div>
      <div class="empty" id="empty" style="display:none;">
        <span class="moon">🌙</span>
        <p>还没有记录任何梦境，开始你的第一个故事吧</p>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = "dream_journal_entries";
  let entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  let editingId = null;
  let selectedMood = "";

  const $ = (id) => document.getElementById(id);
  const dreamTime = $("dreamTime");
  const dreamTitle = $("dreamTitle");
  const dreamContent = $("dreamContent");
  const moodRow = $("moodRow");
  const saveBtn = $("saveBtn");
  const cancelBtn = $("cancelBtn");
  const formTitle = $("formTitle");
  const entriesEl = $("entries");
  const emptyEl = $("empty");
  const searchInput = $("searchInput");
  const sortSelect = $("sortSelect");
  const todayLabel = $("todayLabel");
  const toast = $("toast");

  // today label
  const now = new Date();
  const weekdays = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  todayLabel.textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 · ${weekdays[now.getDay()]}`;

  // default time = now (local)
  function toLocalInput(d) {
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  dreamTime.value = toLocalInput(new Date());

  // mood selection
  moodRow.addEventListener("click", (e) => {
    const chip = e.target.closest(".mood-chip");
    if (!chip) return;
    document.querySelectorAll(".mood-chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    selectedMood = chip.dataset.mood;
  });

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove("show"), 2000);
  }

  function save() {
    const time = dreamTime.value;
    const title = dreamTitle.value.trim();
    const content = dreamContent.value.trim();
    if (!time) { showToast("请选择梦境时间"); return; }
    if (!content) { showToast("请填写梦境内容"); return; }

    const record = {
      id: editingId || Date.now().toString(),
      time,
      title: title || "无题",
      content,
      mood: selectedMood,
      updatedAt: Date.now()
    };

    if (editingId) {
      entries = entries.map(e => e.id === editingId ? record : e);
      showToast("梦境已更新");
    } else {
      entries.unshift(record);
      showToast("梦境已保存");
    }
    persist();
    resetForm();
    render();
  }

  function persist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }

  function resetForm() {
    editingId = null;
    selectedMood = "";
    dreamTime.value = toLocalInput(new Date());
    dreamTitle.value = "";
    dreamContent.value = "";
    document.querySelectorAll(".mood-chip").forEach(c => c.classList.remove("active"));
    formTitle.textContent = "记录新的梦境";
    saveBtn.textContent = "保存梦境";
    cancelBtn.style.display = "none";
  }

  function editEntry(id) {
    const e = entries.find(x => x.id === id);
    if (!e) return;
    editingId = id;
    dreamTime.value = e.time;
    dreamTitle.value = e.title === "无题" ? "" : e.title;
    dreamContent.value = e.content;
    selectedMood = e.mood || "";
    document.querySelectorAll(".mood-chip").forEach(c => {
      c.classList.toggle("active", c.dataset.mood === selectedMood);
    });
    formTitle.textContent = "编辑梦境";
    saveBtn.textContent = "更新梦境";
    cancelBtn.style.display = "inline-block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function deleteEntry(id) {
    if (!confirm("确定要删除这条梦境记录吗？")) return;
    entries = entries.filter(e => e.id !== id);
    persist();
    render();
    showToast("已删除");
  }

  function formatTime(iso) {
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, "0");
    const weekdays = ["周日","周一","周二","周三","周四","周五","周六"];
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())} · ${weekdays[d.getDay()]}`;
  }

  function render() {
    const keyword = searchInput.value.trim().toLowerCase();
    const sort = sortSelect.value;

    let list = entries.filter(e => {
      if (!keyword) return true;
      return e.title.toLowerCase().includes(keyword) || e.content.toLowerCase().includes(keyword);
    });

    list = [...list].sort((a, b) => {
      const ta = new Date(a.time).getTime();
      const tb = new Date(b.time).getTime();
      return sort === "desc" ? tb - ta : ta - tb;
    });

    entriesEl.innerHTML = "";
    if (list.length === 0) {
      emptyEl.style.display = "block";
      emptyEl.querySelector("p").textContent = entries.length === 0
        ? "还没有记录任何梦境，开始你的第一个故事吧"
        : "没有找到匹配的梦境";
      return;
    }
    emptyEl.style.display = "none";

    list.forEach(e => {
      const card = document.createElement("div");
      card.className = "entry";
      card.innerHTML = `
        <div class="entry-head">
          <div>
            <div class="entry-title"></div>
            <div class="entry-meta">
              <span>🕐 ${formatTime(e.time)}</span>
              ${e.mood ? `<span class="mood-tag">${e.mood}</span>` : ""}
            </div>
          </div>
        </div>
        <div class="entry-content"></div>
        <div class="entry-actions">
          <button class="icon-btn" data-act="edit" data-id="${e.id}">✏️ 编辑</button>
          <button class="icon-btn danger" data-act="del" data-id="${e.id}">🗑️ 删除</button>
        </div>
      `;
      card.querySelector(".entry-title").textContent = e.title;
      card.querySelector(".entry-content").textContent = e.content;
      entriesEl.appendChild(card);
    });
  }

  entriesEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const id = btn.dataset.id;
    if (btn.dataset.act === "edit") editEntry(id);
    else if (btn.dataset.act === "del") deleteEntry(id);
  });

  saveBtn.addEventListener("click", save);
  cancelBtn.addEventListener("click", resetForm);
  searchInput.addEventListener("input", render);
  sortSelect.addEventListener("change", render);

  render();
</script>
</body>
</html>
